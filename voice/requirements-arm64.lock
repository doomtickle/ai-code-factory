# Every Python package in the Apple silicon voice image (Dockerfile.arm64): exact versions and sha256
# hashes, the full transitive set. Linux aarch64, CPython 3.11 only. The versions are requirements.lock's,
# without what only the CUDA build needs (the nvidia-* packages and triton). torch is PyPI's aarch64
# wheel, which is CPU-only. Hashes are every wheel of that version PyPI lists for this platform, from
# its JSON API, and the spaCy model's as in requirements.lock. docopt has no wheel: as there, the
# Dockerfile lets pip build that one sdist and nothing else. The faster-whisper set (POST /listen) was
# resolved for aarch64 from PyPI's JSON API and has not been installed on aarch64.
