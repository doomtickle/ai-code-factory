# Local overrides for the developer role, layered over roles/developer/role.conf.
# Copy to ~/.config/ai-code-factory/roles/developer.conf (one file per role,
# named <role>.conf) and uncomment what you need; `factory start` applies it.
# Same KEY="value" lines as role.conf, but only these keys: MODEL, MODELS,
# EFFORT, LANES, MAX_SESSION_TOKENS, MAX_TURNS, MAX_JOB_SECONDS. Anything else is
# refused.
#
# MODELS="claude-haiku-5-5 opus claude-fable-5-1"
# MAX_JOB_SECONDS="7200"
