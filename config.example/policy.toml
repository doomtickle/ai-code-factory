# Example local broker policy. `factory config init` copies this folder to
# ~/.config/ai-code-factory/ ($XDG_CONFIG_HOME/ai-code-factory/ if you set
# it). Every value below is a commented placeholder, so the copy changes
# nothing until you uncomment a line and fill in your own value. Then rebuild
# the broker image and recreate the broker sandbox with:
#   factory update
#
# This file overrides broker/policy.toml table by table: a key set here
# replaces the repo's value, keys you leave out keep it. It is baked into the
# broker image at build time, so agents can't read or change it. A table you
# uncomment is inert for projects that don't use it: npm_fetch only contacts
# the private registry for lockfile entries that point at it.

# [packages]
# A private npm registry: URL prefix ending in "/". Its token goes in the host
# keychain (service "factory-npm-registry"), never here. Its host must also be
# in broker-kit/spec.yaml.
# npm_private_registry = "https://example.jfrog.io/example/api/npm/npm-local/"
# Hosts the registry may redirect downloads to (JFrog Cloud: its signed S3
# storage host). npm_fetch names the host to add when it refuses a redirect.
# npm_redirect_hosts = ["jfrog-prod-use1-shared-example.s3.amazonaws.com"]

# [jira]
# Your Jira Cloud site and its cloudId (from https://<site>/_edge/tenant_info).
# The token goes in the host keychain (service "factory-jira"), never here.
# site = "example.atlassian.net"
# cloud_id = "00000000-0000-0000-0000-000000000000"

[git]
# Repos agents may fetch from, push to and open PRs or merge requests on:
# GitHub repos as owner/name, GitLab projects host first, or a whole GitLab
# group with a final "/*" (any project under it, subgroups included; GitLab
# only, and the host must be the one in [gitlab].url), e.g.
#   repos = ["my-org/my-project", "gitlab.example.com/my-group/my-project"]
#   repos = ["gitlab.example.com/my-group/*"]
# A group entry wants a GitLab group access token (Developer role, api and
# write_repository scopes). Keep this on a single line: bin/factory's
# onboarding check depends on it.
repos = []
# The git identity the developer's lane commits are authored with (repo-local
# user.name and user.email in each lane clone). "{lane}" stands for the lane's
# name. Unset: factory-<lane> <<lane>@factory.invalid>. Read by the dispatch
# bridge, not the broker: `factory start` applies a change, no rebuild needed.
# author_name = "Example Bot ({lane})"
# author_email = "bot+{lane}@example.com"

# A self-hosted GitLab (or https://gitlab.com/) for the git tools and
# gitlab_create_mr: https://<host>/, ending in "/". Its token goes in the host
# keychain (service "factory-gitlab", `factory secret save gitlab`), never
# here. Its host must also be in broker-kit/spec.yaml. Unset = no GitLab.
# [gitlab]
# url = "https://gitlab.example.com/"

# Repos the reviewer may file issues in (github_create_issue). Private
# trackers only: an issue in a public repo publishes what an agent writes.
# The GitHub token needs Issues read/write on them. Empty = no issues.
# [github]
# issue_repos = ["my-org/tracker"]

# Repos whose issues the read-only github_get_issue / github_list_issues may
# read (the Coordinator's opt-in grant in kits/coordinator/broker.conf, the
# same list for any role granted them). Its own list: not [git].repos, not
# issue_repos. Issue text is written by others and is always handed to the
# agent as untrusted data; list repos whose issue authors you trust. The
# GitHub token needs Issues read on them. Empty = both tools return DENIED.
# Goes in the same [github] table as issue_repos.
# issue_read_repos = ["my-org/tracker"]

# Hold writes for a person. Each tool named here is staged for your decision
# (the dashboard's control unit, or `factory approvals`) instead of leaving
# the machine: the agent's call returns at once, the gateway makes the write
# itself once you approve, and a pending card can be decided for
# expire_seconds (default 86400, a day). hold_seconds is no longer read;
# delete it from your copy. Leave the table out (or
# tools = []) and nothing is held. Name every tool you want held: leaving
# gitlab_create_mr out lets merge requests open unheld (factory status warns).
# To be told when something is waiting, save a Slack, Discord or ntfy webhook
# URL with `factory secret save approvals-webhook`.
# [approvals]
# tools = ["git_push", "github_create_pr", "github_update_pr", "gitlab_create_mr"]
# expire_seconds = 86400
