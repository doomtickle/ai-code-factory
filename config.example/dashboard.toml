# Example dashboard look. `factory config init` copies this folder to
# ~/.config/ai-code-factory/ ($XDG_CONFIG_HOME/ai-code-factory/ if you set
# it). The line below is a commented placeholder, so the copy changes
# nothing until you uncomment it and fill in your own value.
#
# `factory dashboard` reads this file once, when it starts: restart the
# dashboard to see a change. It only changes how the page looks. Nothing here
# is run, and nothing here touches the broker, the roles or any permission. A
# mistake (an unknown key, a bad value) makes the dashboard ignore the whole
# file and show its defaults; the reason is in its log and on the SETTINGS
# screen.
#
# Older files may still set shifts, crt, sound, ui or a [roles.colors] table
# (they belonged to the retired classic view). The dashboard still starts with
# them and ignores them, with a one-line note in its log; you can delete them.

# The nameplate in the header (up to 24 characters of printable ASCII, in
# "double" or 'single' quotes, without escapes). Default: LOIS.
# plant = "LOIS WORKS"
