# Publishes the `factory docs` page to GitHub Pages on every push to main
# that changes the docs or their generator. The page is the same one
# `factory docs` builds locally, except that links to repo files point at
# this commit on GitHub instead of a local checkout.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - scripts/docs.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the docs page
        run: |
          mkdir -p _site
          python3 scripts/docs.py --root . --out _site/index.html \
            --link-base "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/"
          cp docs/mac-quickstart.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
