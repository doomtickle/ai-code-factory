# Broker tools the Coordinator may call directly (space-separated), with no
# role in between. Parsed by scripts/lib/roles.sh the same way a role.conf is
# (parsed, never sourced). Empty or missing means the Coordinator gets no
# static-mcp registration for the broker.
# None by default. The read-only tools are the opt-in: Jira (README, "Enabling
# Jira"): BROKER_TOOLS="jira_my_issues jira_get_issue", and GitHub issues
# (README, "Enabling GitHub issues"): "github_get_issue github_list_issues".
# Either, then `factory update` (gaining or changing broker access recreates
# the Coordinator's sandbox).
# Known tools: broker/tools.txt.
BROKER_TOOLS=""
