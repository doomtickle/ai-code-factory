<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="term-key" content="__TERM_KEY__">
<title>Terminal 0</title>
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/term.css">
<script src="/vendor/xterm/xterm.js" defer></script>
<script src="/vendor/xterm/addon-fit.js" defer></script>
<script src="/term.js" defer></script>
</head>
<body>
<div id="term" aria-label="Coordinator terminal"></div>
<div class="copy" id="copy" role="region" aria-label="Copy from the Coordinator" aria-live="polite" hidden>
  <p class="copy-title" id="copy-title"></p>
  <p class="copy-preview" id="copy-preview"></p>
  <p class="copy-note" id="copy-note" hidden></p>
  <textarea class="copy-manual" id="copy-manual" readonly hidden aria-label="Text to copy"></textarea>
  <div class="copy-keys">
    <button type="button" class="key" id="copy-go">Copy</button>
    <button type="button" class="key dim" id="copy-x">Dismiss</button>
  </div>
</div>
<div class="off" id="off" hidden>
  <p class="banner" id="off-title">TERMINAL 0 · POWERED OFF</p>
  <p class="note" id="off-text"></p>
  <div class="powers">
    <button type="button" class="power" id="power">Power on</button>
    <button type="button" class="power" id="resume">Resume</button>
  </div>
</div>
</body>
</html>
