# Broker policy: what agents may do through the broker's tools.
#
# This file is baked into the factory-broker image at build time, so agents
# cannot change it from their workspace. After editing, rebuild and restart:
#   ./scripts/00-build-templates.sh && sbx rm --force factory-broker
#
# Keep it generic: it's shared by everyone who uses this repo, on any project.
# Settings for your organization or machine (a private npm registry, your Jira
# site) go in policy.toml in the factory config folder,
# ~/.config/ai-code-factory/ (see config.example/ and README, Local settings).
# That file is baked in next to this one and overrides it table by table.
#
# Every host the broker contacts must ALSO be allowed in kits/broker/spec.yaml
# (the sbx egress policy). This file decides per request; the kit is the
# network-level backstop.

[web]
# Hosts web_fetch may GET. "*.example.com" matches subdomains only.
allow_hosts = [
  "docs.python.org",
  "developer.mozilla.org",
  "nodejs.org",
  "docs.github.com",
  "pypi.org",
  "www.npmjs.com",
]
max_bytes = 500_000

[git]
# GitHub repos (owner/name) agents may fetch from, push to and open PRs on.
# Empty means git tools are disabled.
# Keep this on a single line: bin/factory's onboarding check depends on it.
repos = []
# Branches agents may never push to (glob patterns).
protected_branches = ["main", "master", "release/*"]
# Agents may only push branches with this prefix ("" to allow any unprotected branch).
push_branch_prefix = "factory/"
# Base branch used when a tool call does not name one.
default_base = "main"

[packages]
# Lowercase package names. An empty *_allow list means "anything not denied".
npm_deny = []
npm_allow = []
pypi_deny = []
pypi_allow = []
# npm_fetch downloads tarballs from registry.npmjs.org (registry.yarnpkg.com
# URLs in yarn lockfiles are fetched from there) and from this private
# registry, a URL prefix ending in "/". Only requests under this prefix carry
# the credential from host keychain service "factory-npm-registry" (README,
# Enabling a private npm registry). Set it in your local policy.toml, with its
# host in your local broker-kit. "" = public registry only.
npm_private_registry = ""
# Hosts a registry download may be redirected to (exact, or "*.example.com"
# for subdomains), e.g. the cloud storage JFrog Cloud serves tarballs from.
# Redirects are https only and never carry the registry credential; each host
# must also be in the broker kit. npm_fetch's error for a refused redirect
# names the host to add. Set in your local policy.toml.
npm_redirect_hosts = []

[filters]
max_commits = 200
max_diff_bytes = 2_000_000

[gemini]
# gemini_flash_query. The API key comes from the broker sandbox's own
# /etc/factory-broker/secrets/gemini file (host keychain service
# "factory-gemini", delivered by scripts/start-broker.sh), never from this
# file or the workspace. See README, Enabling Gemini Flash queries.
model = "gemini-2.5-flash"
max_prompt_chars = 50_000

[jira]
# jira_my_issues / jira_get_issue: Jira Cloud REST API v3, reached through the
# scoped-token gateway at api.atlassian.com/ex/jira/<cloudId>/... . The
# credential (email:token) comes from the broker sandbox's own
# /etc/factory-broker/secrets/jira file (host keychain service "factory-jira",
# delivered by scripts/start-broker.sh), never from this file or the
# workspace. See README, Enabling Jira.
# Your Jira Cloud site (e.g. "example.atlassian.net") and its cloudId, from
# https://<site>/_edge/tenant_info (public tenant info, not a secret). Set
# both in your local policy.toml. Empty or not a UUID means both Jira tools
# return DENIED with that hint.
site = ""
cloud_id = ""
# Optional allowlist of project keys (e.g. ["PROJ", "OPS"]). Empty means any
# project, since results are already limited to the caller's own issues.
projects = []
max_results = 25
max_comments = 5
