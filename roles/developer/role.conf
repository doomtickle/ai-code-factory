# Role definition, read by scripts/lib/roles.sh and dispatch/server.py.
# Values are plain strings; this file is parsed, never executed.

# One line shown to the Coordinator by list_roles.
DESCRIPTION="Implements features and fixes, writes and runs the tests, and updates the docs"
# Sandbox image: factory-<TEMPLATE>:<tag> (developer = base tooling, reviewer = base + ruff).
TEMPLATE="developer"
# Both mount the project read-only. rw: works in private git clones of it
# (lanes) and hands back committed factory/* branches, which appear in the
# project as factory-<lane>/... remote-tracking branches; it can also write
# bundles to .factory/outgoing/ for git_push. ro: writes only to its own
# scratch directory (roles/<name>/ in the factory state dir).
WORKSPACE="rw"
# Jobs this role may run at once, 1 to 8 (each in its own lane: own session,
# transcript and, for rw roles, its own clones; all share the one sandbox).
# Lane 1 is named after the role, the others <role>-lane2, -lane3, ...
# Read per job, so a change applies from the next task (`factory start` updates
# the role's tab to show the new lanes). Empty = 1.
LANES="3"
# Broker tools this role may call (space-separated). Empty = no broker access.
# Known tools: broker/tools.txt.
BROKER_TOOLS="npm_fetch pip_download git_fetch git_push github_create_pr gitlab_create_mr"
# Model for this role's `claude -p` invocations: an alias (sonnet/opus/haiku)
# or a full model id (e.g. claude-sonnet-5-5). Empty = use the sandbox's default model.
# Pinned to the full id, not the alias "sonnet": the Claude Code CLI in the
# pinned role image resolves that alias to the older claude-sonnet-5.
MODEL="claude-sonnet-5-5"
# Other models the Coordinator may pick for a single task (delegate's `model`),
# e.g. a cheaper one for prose-only changes (docs, PR text) or a stronger one
# for hard problems. Haiku never touches code: see the Coordinator briefing.
# Space-separated aliases or ids. Empty = always MODEL.
# Haiku is likewise pinned to the full id claude-haiku-5-5, not the alias:
# the same pinned CLI resolves "haiku" to the older claude-haiku-4-5-20251001.
# Opus is left as the alias: it already resolves to claude-opus-5-5.
MODELS="claude-haiku-5-5 opus"
# Default reasoning effort (claude --effort): low, medium, high or xhigh. The
# Coordinator can override it per task. Empty = the model's default.
EFFORT=""
# Saved-session cap in context tokens: a task for this role whose saved session
# is larger starts fresh instead of re-reading all that history. Empty = 100000;
# "0" = no cap.
MAX_SESSION_TOKENS=""
# Cap on the turns (tool calls and replies) one job may take. A job that
# reaches it stops as failed, keeping its session, so a follow-up task on the
# same lane can continue. A safety net against a lost job, set well above
# normal (developer jobs so far peaked at 131 tool calls). Empty or "0" = no cap.
MAX_TURNS="200"
