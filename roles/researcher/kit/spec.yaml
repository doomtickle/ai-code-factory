schemaVersion: "2"
kind: mixin
name: factory-researcher-kit
displayName: Factory Researcher
description: "Investigates on the web and reports (read-only)"
version: "5.1.0"
requires:
  agent: claude

# Instructions live in ../instructions.md: the dispatch bridge passes them to
# every task (a mixin's agentInstructions aren't reliably loaded).
permissions:
  network:
    # Model provider only. Any other network access goes through the broker's
    # MCP tools, limited to BROKER_TOOLS in ../role.conf.
    allow:
      - api.anthropic.com

setup:
  install:
    # Claude Code's built-in WebFetch can never work here (no egress) and only
    # wastes turns. WebSearch stays: it is served by the model API (the one web
    # read that doesn't pass the broker, so unaudited and not allowlisted), and
    # this role can't write to the project; its instructions treat results as
    # leads to verify through web_fetch, never as sources.
    # Root-owned managed settings: bypassPermissions can't override them.
    - command: >-
        mkdir -p /etc/claude-code &&
        printf '%s\n' '{"permissions":{"deny":["WebFetch"]}}'
        > /etc/claude-code/managed-settings.json &&
        chmod 0444 /etc/claude-code/managed-settings.json
      user: "0"
      description: "Deny the built-in WebFetch (no egress); WebSearch stays for this role only"
