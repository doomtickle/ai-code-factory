# Role definition, read by scripts/lib/roles.sh and dispatch/server.py.
# Values are plain strings; this file is parsed, never executed.

# One line shown to the Coordinator by list_roles.
DESCRIPTION="Investigates libraries, APIs and approaches on the web; the only role that reads web content; reports findings with sources"
# Sandbox image: factory-<TEMPLATE>:<tag> (developer = base tooling, reviewer = base + ruff).
TEMPLATE="developer"
# rw: works directly in the project. ro: project mounted read-only; writes only
# to its own scratch directory (roles/<name>/ in the factory state dir).
WORKSPACE="ro"
# Broker tools this role may call (space-separated). Empty = no broker access.
# Known tools: broker/tools.txt.
BROKER_TOOLS="web_fetch gemini_flash_query"
# Model for this role's `claude -p` invocations: an alias (sonnet/opus/haiku)
# or a full model id (e.g. claude-sonnet-5). Empty = use the sandbox's default model.
MODEL="sonnet"
# Saved-session cap in context tokens: a task for this role whose saved session
# is larger starts fresh instead of re-reading all that history. Empty = 150000;
# "0" = no cap.
MAX_SESSION_TOKENS=""
