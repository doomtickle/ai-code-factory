# Role definition, read by factory/conf.py (shared with dispatch/server.py) and scripts/lib/roles.sh.
# Values are plain strings; this file is parsed, never executed.

# Off by default. A machine turns it on by naming it in
# ~/.config/ai-code-factory/enabled-roles (README, "Optional roles"); until
# then no sandbox, broker token or grants.
OPTIONAL="1"
# One line shown to the Coordinator by list_roles.
DESCRIPTION="Reviews how recent changes went, labels root causes, proposes one improvement to the factory; read-only"
# Sandbox image: factory-<TEMPLATE>:<tag> (developer = base tooling, reviewer = base + ruff).
TEMPLATE="developer"
# ro: mounts the project read-only and writes only to its own scratch
# directory (roles/<name>/ in the factory state dir), where the bridge puts
# the evidence pack.
WORKSPACE="ro"
# Jobs this role may run at once, 1 to 8. One analyst job at a time.
LANES="1"
# Broker tools this role may call (space-separated). Empty = no broker access:
# everything it needs is in the evidence pack and the read-only project.
BROKER_TOOLS=""
# Model for this role's `claude -p` invocations: an alias or a full model id.
# Pinned to the full id, as the researcher's is: the Claude Code CLI in the
# pinned role image resolves the aliases to older models.
MODEL="claude-opus-5-5"
# Other models the Coordinator may pick for a single task (delegate's `model`).
MODELS="sonnet"
# Default reasoning effort (claude --effort): low, medium, high or xhigh.
EFFORT="high"
# Saved-session cap in context tokens. Empty = 100000; "0" = no cap.
MAX_SESSION_TOKENS=""
# Cap on the turns one job may take; a job that reaches it stops as failed.
MAX_TURNS="80"
